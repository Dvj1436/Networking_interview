<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hardware Interview Questions</title>
  <style>
   body{
 font-family: Arial, sans-serif;
      background: #00ffdd;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;

    }
    .container {
      font-size: 28px;
  color: #00ffcc;
  background-color: #000000;
  border: 2px solid #00ffcc;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
  transition: all 0.3s ease-in-out;

    }
    #question {
      font-size: 28px;
      margin-bottom: 40px;
      min-height: 100px;
    }
    button {
      font-size: 20px;
      padding: 10px 30px;
      cursor: pointer;
      background-color: green;
      color: Black;
      border: none;
      border-radius: 5px;
      margin: 10px;
      box-shadow: 0 0 30px #00ffee, 0 0 60px #00ffee, 0 0 90px #00ffee;
      transform: scale(1.05);
    }
    button:hover {
      background-color: #00ada3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="question">Loading...</div>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>
    <button id="startBtn" onclick="startAgain()" style="display: none;">Start Again</button>
  </div>

  <script>
    const allQuestions = [
       "What is a computer network, and what are its benefits?",
      "Describe the different types of computer networks (LAN, WAN, MAN).",
      "Explain the concept of network topology (bus, star, ring, mesh).",
      "What is the role of a network protocol in facilitating communication?",
      "Describe the OSI model and its layers.",
      "Explain the TCP/IP model and its layers.",
      "What is the difference between connection-oriented and connectionless protocols?",
      "Describe the role of IP addresses in networking.",
      "Explain the concept of subnetting and its benefits.",
      "What are the different types of network cables (coaxial, twisted pair, fiber optic)?",
      "Describe the role of routers in networking.",
      "Explain the concept of network address translation (NAT).",
      "What is the purpose of a default gateway?",
      "Describe the role of DNS (Domain Name System) in networking.",
      "Explain the concept of network latency and its impact.",
      "What is the function of a router in a network?",
      "Describe the role of a switch in a network.",
      "Explain the difference between a hub and a switch.",
      "What is the purpose of a network interface card (NIC)?",
      "Describe the role of a modem in a network.",
      "Explain the concept of a firewall and its benefits.",
      "What are the different types of firewalls (hardware, software)?",
      "Describe the role of a wireless access point (WAP) in a network.",
      "Explain the concept of network segmentation.",
      "What are the benefits of using a network device with built-in security features?",
      "What is the role of HTTP (Hypertext Transfer Protocol) in networking?",
      "Describe the function of FTP (File Transfer Protocol) in networking.",
      "Explain the concept of SMTP (Simple Mail Transfer Protocol).",
      "What is the role of DHCP (Dynamic Host Configuration Protocol) in networking?",
      "Describe the function of DNS (Domain Name System) in resolving domain names.",
      "Explain the concept of SNMP (Simple Network Management Protocol).",
      "What are the benefits of using secure protocols (HTTPS, SFTP)?",
      "Describe the role of TCP (Transmission Control Protocol) in ensuring reliable data transfer.",
      "Explain the concept of UDP (User Datagram Protocol) and its benefits.",
      "What are the different types of network protocols (routing, transport, application)?",
      "Describe the role of ARP (Address Resolution Protocol) in resolving IP addresses.",
      "Explain the concept of ICMP (Internet Control Message Protocol).",
      "What is the purpose of IGMP (Internet Group Management Protocol)?",
      "Describe the role of BGP (Border Gateway Protocol) in routing.",
      "Explain the concept of OSPF (Open Shortest Path First) routing protocol.",
      "What are the common types of network threats (malware, phishing, DDoS)?",
      "Describe the importance of network security measures.",
      "Explain the concept of encryption and its benefits.",
      "What are the different types of encryption (symmetric, asymmetric)?",
      "Describe the role of firewalls in network security.",
      "Explain the concept of intrusion detection and prevention systems.",
      "What are the benefits of using secure network protocols (HTTPS, SSH)?",
      "Describe the importance of regular network security audits.",
      "Explain the concept of network segmentation for security.",
      "What are the best practices for securing a network?",
      "What are the benefits of using wireless networking?",
      "Describe the different types of wireless networks (Wi-Fi, Bluetooth).",
      "Explain the concept of wireless network security (WEP, WPA, WPA2).",
      "What are the common wireless network topologies (infrastructure, ad-hoc)?",
      "Describe the role of wireless access points (WAPs) in networking.",
      "Explain the concept of wireless network range and coverage.",
      "What are the benefits of using wireless network extenders?",
      "Describe the importance of wireless network configuration and optimization.",
      "Explain the concept of wireless network interference and mitigation.",
      "What are the best practices for securing a wireless network?"
    ];

    let selectedQuestions = [];
    let currentIndex = 0;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function loadFiveQuestions() {
      selectedQuestions = shuffle(allQuestions).slice(0, 5);
      currentIndex = 0;
      showQuestion();
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.getElementById('startBtn').style.display = 'none';
    }

    function showQuestion() {
      document.getElementById('question').textContent = selectedQuestions[currentIndex];
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < selectedQuestions.length) {
        showQuestion();
      } else {
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('question').textContent = "End of 5 questions.";
        document.getElementById('startBtn').style.display = 'inline-block';
      }
    }

    function startAgain() {
      loadFiveQuestions();
    }

    // Initialize
    loadFiveQuestions();
  </script>
</body>
</html>
